# Valores por defecto = Estándares de Integración (GW-C §5). Todo se sobrescribe con variables de entorno.
spring:
  application:
    name: api-gateway
  # El GW no sirve archivos estáticos: sin este manejador, lo que no es una ruta responde 404 (también el preflight).
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      server:
        webflux:
          # Sin volcado de tráfico: registraría cabeceras (Authorization) y cuerpos.
          httpclient:
            wiretap: false
          httpserver:
            wiretap: false

server:
  port: ${SERVER_PORT:8080}

# Actuator solo en el puerto de gestión (interno). El health público del puerto externo es propio (PublicHealthConfig).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

# Logs en JSON con los campos de los Estándares §8.
logging:
  structured:
    format:
      console: edu.eci.dosw.campusseguro.gateway.gateway_service.logging.GatewayJsonLogFormatter
  level:
    root: ${LOG_LEVEL:INFO}
    # Acotados aunque LOG_LEVEL=DEBUG: en DEBUG/TRACE registran cabeceras de las solicitudes.
    reactor.netty: INFO
    org.springframework.cloud.gateway: INFO

# Tabla de rutas (GW-C §2). Solo rutas publicadas en el swagger.yml del MS (RN-GW-03).
gateway:
  downstream-timeout: ${GATEWAY_DOWNSTREAM_TIMEOUT_MS:3000}ms
  routes:
    - id: ms01
      uri: ${MS01_URI}
      paths:
        - /api/v1/auth/**
        - /api/v1/users
        - /api/v1/users/**
        - /api/v1/roles
        - /api/v1/roles/**
        - /api/v1/permissions
    - id: ms02
      uri: ${MS02_URI}
      paths:
        - /api/v1/buildings
        - /api/v1/buildings/**
        - /api/v1/floors/**
        - /api/v1/spaces/**
        - /api/v1/safe-zones
        - /api/v1/safe-zones/**
        - /api/v1/evacuation-routes
        - /api/v1/evacuation-routes/**
        - /api/v1/preventive-recommendations
        - /api/v1/preventive-recommendations/**
        - /api/v1/campuses
        - /api/v1/campuses/**
        - /api/v1/open-zones/**
        - /api/v1/exits/**
        - /api/v1/stairs/**
        - /api/v1/public/**
        - /api/v1/images
        - /api/v1/images/**
    - id: ms03
      uri: ${MS03_URI}
      paths:
        - /api/v1/alertas
        - /api/v1/alertas/**
    - id: ms04
      uri: ${MS04_URI}
      paths:
        - /api/v1/chi/**
    - id: ms05
      uri: ${MS05_URI}
      paths:
        - /api/v1/brigadistas/**
        - /api/v1/incidentes/**
        - /api/v1/bei/**
        - /api/v1/asignaciones/**
        - /api/v1/responsabilidades/**
    - id: ms06
      uri: ${MS06_URI}
      paths:
        - /api/v1/eventos
        - /api/v1/eventos/**
        - /api/v1/tipos-evento
        - /api/v1/tipos-evento/**
    - id: ms08
      uri: ${MS08_URI}
      paths:
        - /api/v1/analitica/**
        - /api/v1/auditoria/**
        # Auditoría de todos los MS (Estándares §12): ruta interna, ya declarada en access.internal-routes.
        - /api/v1/audit/events

  # Políticas de acceso por método + ruta exacta (GW-C §3). Lo que no está aquí es protegido (RN-GW-08).
  # Las públicas deben coincidir con los Estándares §2; agregar una exige PR en los Estándares.
  access:
    public-routes:
      - { method: GET, path: /actuator/health }
      - { method: POST, path: /api/v1/auth/register }
      - { method: POST, path: /api/v1/auth/login }
      - { method: POST, path: /api/v1/auth/password/forgot }
      - { method: POST, path: /api/v1/auth/password/reset }
    internal-routes:
      - { method: POST, path: /api/v1/audit/events }
      - { method: POST, path: /api/v1/users/batch }
      - { method: GET, path: /api/v1/users/by-role }

  # CORS solo en el GW (Estándares §2.1). Métodos y cabeceras son fijos en el código.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE_SECONDS:3600}s

  # Claves de servicio para las llamadas internas (Estándares §5). Vacía = ese MS no llama a través del GW.
  service-keys:
    ms01: ${GW_SERVICE_KEY_MS01:}
    ms02: ${GW_SERVICE_KEY_MS02:}
    ms03: ${GW_SERVICE_KEY_MS03:}
    ms04: ${GW_SERVICE_KEY_MS04:}
    ms05: ${GW_SERVICE_KEY_MS05:}
    ms06: ${GW_SERVICE_KEY_MS06:}
    ms07: ${GW_SERVICE_KEY_MS07:}
    ms08: ${GW_SERVICE_KEY_MS08:}

  # Cortes de sesión que publica MS01 (Estándares §3, RF-MS01-11): ruta interna que el GW consulta él mismo, sin
  # publicarla. Por defecto, la dirección de MS01 más la ruta; con mTLS en la nube usa la misma conexión de las rutas.
  session-cuts:
    url: ${SESSION_CUTS_URL:${MS01_URI}/api/v1/internal/session-cuts}
    interval: ${SESSION_CUTS_INTERVAL_SECONDS:4}s
    timeout: ${SESSION_CUTS_TIMEOUT_SECONDS:3}s

  # Validación local del JWT emitido por MS01 (Estándares §3).
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
    issuer: ${JWT_ISSUER:ms01-identity-and-access}
    audience: ${JWT_AUDIENCE:campusseguro}
    clock-skew: ${JWT_CLOCK_SKEW_SECONDS:30}s
    max-lifetime: ${JWT_MAX_LIFETIME_SECONDS:3600}s
