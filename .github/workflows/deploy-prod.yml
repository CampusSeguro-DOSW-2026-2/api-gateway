name: Desplegar a producción

# CD a producción (ADR-006): manual, solo desde main y con la aprobación que exige el Environment gw-prod.
# Promueve la misma imagen que ya pasó por test (sha-xxxxxxx), sin reconstruirla. Otro tag anterior = rollback.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Imagen a promover (sha-xxxxxxx), la misma que ya se probó en test
        type: string
        required: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Solo desde main y con un tag sha-xxxxxxx
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Producción solo se despliega desde main (recibido: $GITHUB_REF)"; exit 1; }
          [[ "$TAG" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "::error::El tag debe tener la forma sha-xxxxxxx (recibido: $TAG)"; exit 1; }

  desplegar:
    needs: verificar
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      entorno: prod
      ref: ${{ github.sha }}
      tag: ${{ inputs.tag }}
    secrets: inherit
