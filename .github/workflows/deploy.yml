name: Desplegar

# Workflow reutilizable (ADR-006): despliega una imagen ya publicada en la VM del GW, con el runner self-hosted de
# etiqueta "gw" y las variables y secretos del Environment gw-<entorno>. Lo llaman ci.yml (test) y deploy-prod.yml.
on:
  workflow_call:
    inputs:
      entorno:
        description: test o prod
        type: string
        required: true
      ref:
        description: Commit del que se toman los archivos de infra/
        type: string
        required: true
      tag:
        description: Imagen a desplegar (sha-xxxxxxx). Vacía = la del commit de ref.
        type: string
        required: false
        default: ''

jobs:
  desplegar:
    runs-on: [self-hosted, gw]
    environment: gw-${{ inputs.entorno }}
    timeout-minutes: 15
    concurrency:
      group: desplegar-gw-${{ inputs.entorno }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Desplegar y verificar
        run: infra/deploy.sh
        env:
          ENTORNO: ${{ inputs.entorno }}
          TAG: ${{ inputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          MS01_URI: ${{ vars.MS01_URI }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          GW_EXTRA_ENV: ${{ vars.GW_EXTRA_ENV }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GW_CLIENT_P12_BASE64: ${{ secrets.GW_CLIENT_P12_BASE64 }}
          GW_CLIENT_KEYSTORE_PASSWORD: ${{ secrets.GW_CLIENT_KEYSTORE_PASSWORD }}
          GW_TRUSTED_CA_PEM: ${{ secrets.GW_TRUSTED_CA_PEM }}
          GW_SERVICE_KEY_MS01: ${{ secrets.GW_SERVICE_KEY_MS01 }}
          GW_SERVICE_KEY_MS02: ${{ secrets.GW_SERVICE_KEY_MS02 }}
          GW_SERVICE_KEY_MS03: ${{ secrets.GW_SERVICE_KEY_MS03 }}
          GW_SERVICE_KEY_MS04: ${{ secrets.GW_SERVICE_KEY_MS04 }}
          GW_SERVICE_KEY_MS05: ${{ secrets.GW_SERVICE_KEY_MS05 }}
          GW_SERVICE_KEY_MS06: ${{ secrets.GW_SERVICE_KEY_MS06 }}
          GW_SERVICE_KEY_MS07: ${{ secrets.GW_SERVICE_KEY_MS07 }}
          GW_SERVICE_KEY_MS08: ${{ secrets.GW_SERVICE_KEY_MS08 }}
