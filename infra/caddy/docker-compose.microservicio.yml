# Borde de la VM de un microservicio (ADR-006). Plantilla para los squads: es lo único que publica puertos.
# Los stacks del MS (prod y test) se unen a la red campus-edge con los alias de UPSTREAM_PROD y UPSTREAM_TEST.
# Uso (en la VM): docker compose -f docker-compose.microservicio.yml up -d
#
# Estructura esperada junto a este archivo (la entrega el dueño del GW; nunca va al repositorio):
#   certs/prod/servidor.crt  certs/prod/servidor.key  certs/prod/ca.pem
#   certs/test/servidor.crt  certs/test/servidor.key  certs/test/ca.pem
name: campus-edge

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
    environment:
      # Nombre DNS y puerto del MS en la red campus-edge, p. ej. ms01-prod:8081 y ms01-test:8081.
      UPSTREAM_PROD: ${UPSTREAM_PROD:?UPSTREAM_PROD es obligatoria (p. ej. ms01-prod:8081)}
      UPSTREAM_TEST: ${UPSTREAM_TEST:?UPSTREAM_TEST es obligatoria (p. ej. ms01-test:8081)}
    volumes:
      - ./Caddyfile.microservicio:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - edge

networks:
  edge:
    name: campus-edge
